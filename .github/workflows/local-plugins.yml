name: Local plugin reload
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Archive the exact source under test
        if: runner.os == 'Linux'
        shell: bash
        run: git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: local-plugin-source
          path: ${{ runner.temp }}/source.zip
          retention-days: 7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Run local plugin regression tests
        shell: bash
        run: ./gradlew :runelite-client:test --tests '*LocalPlugin*' --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-plugin-tests-${{ runner.os }}
          path: |
            runelite-client/build/reports/tests/test/
            runelite-client/build/test-results/test/
          if-no-files-found: ignore
