name: Local plugin reload
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Run local plugin regression tests
        shell: bash
        run: ./gradlew :runelite-client:test --tests '*LocalPlugin*' --console=plain
      - name: Collect public compiler and test libraries for offline diagnostics
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/local-plugin-test-libs"
          find "$HOME/.gradle/caches/modules-2/files-2.1" -type f \( -name 'lombok-1.18.30.jar' -o -name 'junit-4.12.jar' -o -name 'hamcrest-core-1.3.jar' -o -name 'mockito-core-3.1.0.jar' -o -name 'byte-buddy-*.jar' -o -name 'objenesis-*.jar' \) -exec cp '{}' "$RUNNER_TEMP/local-plugin-test-libs/" \;
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: local-plugin-test-libs
          path: ${{ runner.temp }}/local-plugin-test-libs/*.jar
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-plugin-tests-${{ runner.os }}
          path: |
            runelite-client/build/reports/tests/test/
            runelite-client/build/test-results/test/
          if-no-files-found: ignore
