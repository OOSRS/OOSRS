name: API documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - run: xvfb-run -a ./gradlew verifyApiContracts verifyReleaseAbi apiDocs --console=plain
      - name: Assemble documentation site
        run: |
          mkdir -p site
          cp -R openosrs-api/build/docs/javadoc site/openosrs-api
          cp -R runelite-api/build/docs/javadoc site/client-api
          cp docs/api-index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
